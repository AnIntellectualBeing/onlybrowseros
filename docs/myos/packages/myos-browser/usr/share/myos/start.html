<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MyOS</title>
<style>
  body  { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 28px;
          font-family: "DejaVu Sans", sans-serif; background: #eff6ff; color: #1f2937; }
  h1    { margin: 0; font-size: 44px; color: #1d4ed8; }
  form  { display: flex; width: min(600px, 90vw); }
  input { flex: 1; font-size: 18px; padding: 12px 16px; border: 2px solid #93c5fd;
          border-radius: 10px 0 0 10px; outline: none; }
  input:focus { border-color: #1d4ed8; }
  button{ font-size: 18px; padding: 0 22px; border: none; border-radius: 0 10px 10px 0;
          background: #1d4ed8; color: #fff; }
  nav   { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  nav a { width: 130px; padding: 18px 0; text-align: center; border-radius: 12px;
          background: #fff; color: #1f2937; text-decoration: none;
          box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  nav a:hover { outline: 2px solid #93c5fd; }
</style>
</head>
<body>
  <h1>MyOS</h1>
  <form action="https://duckduckgo.com/" method="get">
    <input name="q" placeholder="Search the web" autofocus>
    <button>Search</button>
  </form>
  <nav>
    <a href="https://www.wikipedia.org">Wikipedia</a>
    <a href="https://www.youtube.com">YouTube</a>
    <a href="https://mail.google.com">Gmail</a>
    <a href="https://www.openstreetmap.org">Maps</a>
  </nav>
</body>
</html>
