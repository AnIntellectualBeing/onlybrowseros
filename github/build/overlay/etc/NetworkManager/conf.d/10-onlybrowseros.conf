[main]
plugins=keyfile

# A debootstrap image leaves interfaces to ifupdown; hand them all to
# NetworkManager so both Wi-Fi and a plugged-in cable just work.
[ifupdown]
managed=true

[device]
# Randomised MAC addresses while scanning confuse older access points, and
# any network that filters by MAC.
wifi.scan-rand-mac-address=no

[connection]
# Wi-Fi power saving makes old cards drop out during video calls.
wifi.powersave=2
