# OnlyBrowserOS: a quick press of the power button puts the laptop to sleep
# (the way phones and most laptops behave), so an accidental press never
# throws away open tabs. Holding it shuts down cleanly; Sleep, Restart and
# Shut down are also in the taskbar's power menu. Closing the lid sleeps
# (systemd's default).
[Login]
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff
