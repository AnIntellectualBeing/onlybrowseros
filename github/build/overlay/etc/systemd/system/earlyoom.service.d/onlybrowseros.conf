# OnlyBrowserOS: when memory and swap are both nearly gone, close the heaviest
# browser tab instead of letting the whole laptop freeze for minutes.
#
#   -m 5      act when less than 5% of RAM is free ...
#   -s 20     ... and less than 20% of swap is free
#   --prefer  a tab's content process (the tab shows "crashed" and can reload)
#   --avoid   the screen, taskbar, home screen, browser window and its extension
#             process (which enforces the tab limit), sound, network, installer
#
# Set here rather than in /etc/default/earlyoom, which belongs to the earlyoom
# package. ($$ is a literal $ for systemd.)
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -m 5 -s 20 -r 0 --prefer '^(Web Content|Isolated Web Co|file:// Content)$$' --avoid '^(Xorg|openbox|obos-panel|obos-home|obos-installer|install-helper|rsync|firefox-esr|WebExtensions|pipewire|pipewire-pulse|wireplumber|NetworkManager|systemd|systemd-logind|systemd-journal|dbus-daemon)$$'
