# OnlyBrowserOS: the screen shows only the browser. Ctrl+Alt+F1..F6 does not
# switch to text consoles, and Ctrl+Alt+Backspace does not kill the screen.
# For fixing a broken machine, start with "show start-up messages" from the
# boot menu instead.
Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "DontZap" "true"
EndSection
