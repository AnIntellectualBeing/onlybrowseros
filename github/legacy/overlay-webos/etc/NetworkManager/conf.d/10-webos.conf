[main]
plugins=keyfile
# A debootstrap image leaves interfaces to ifupdown, which means the Wi-Fi tray
# finds nothing. Hand everything to NetworkManager instead.
no-auto-default=*

[ifupdown]
managed=true

[device]
# Randomised MACs confuse older access points and any network that filters by
# MAC, which is exactly the hardware this image targets.
wifi.scan-rand-mac-address=no

[connection]
wifi.powersave=2
