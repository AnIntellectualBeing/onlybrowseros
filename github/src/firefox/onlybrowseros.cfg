// OnlyBrowserOS autoconfig. Firefox skips the first line of this file.
//
// New tabs open the OnlyBrowserOS start page. An extension could do this too,
// but Firefox then asks the user whether to keep "the extension's" new tab
// page, which is exactly the kind of question OnlyBrowserOS avoids.
try {
  const { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
  AboutNewTab.newTabURL = "file:///usr/share/onlybrowseros/start/index.html";
} catch (e) {
  Cu.reportError("onlybrowseros.cfg: " + e);
}

// Only the one browser window: hide the menu entries that open other windows
// or lead to things OnlyBrowserOS replaces. Firefox's own settings (there is
// one OnlyBrowserOS settings page), add-ons, new and private windows, More
// tools, Help, Quit, Save page, the Library window, "Show in folder" (there is
// no folder to show) and "Inspect". Element ids are from Firefox 140 ESR.
try {
  const hidden = [
    "#appMenu-new-window-button2",
    "#appMenu-new-private-window-button2",
    "#appMenu-extensions-themes-button",
    "#appMenu-unified-extensions-button",
    "#unified-extensions-button",
    "#appMenu-settings-button",
    "#appMenu-more-button2",
    "#appMenu-help-button2",
    "#appMenu-quit-button2",
    "#appMenu-save-file-button2",
    "#appMenu-report-broken-site-button",
    "#appMenu-profiles-button",
    "#appMenu-empty-profiles-button",
    "#appMenu-downloads-button",
    "#appMenu-library-downloads-button",
    "#downloadsHistory",
    "#downloadsContextMenu .downloadShowMenuItem",
    "#downloadsContextMenu [command='downloadsCmd_show']",
    "#context-openlinkinwindow",
    "#context-openlinkprivate",
    "#context-inspect",
    "#context-inspect-a11y",
    "#menu_newPrivateWindow",
  ];
  const css = hidden.join(",\n") + " { display: none !important; }";
  const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
  const uri = Services.io.newURI("data:text/css;charset=utf-8," + encodeURIComponent(css));
  if (!sss.sheetRegistered(uri, sss.USER_SHEET)) {
    sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
  }
} catch (e) {
  Cu.reportError("onlybrowseros.cfg: " + e);
}

// One memory clean-up a minute after the browser starts. Starting and
// restoring the session leave garbage that Firefox would otherwise only free
// once memory runs short; freeing it now brings the idle system's memory use
// down by about 40-60 MB (measured, docs/08-memory.md). One pass, a fraction of
// a second of work.
try {
  const onStartup = () => {
    Services.obs.removeObserver(onStartup, "browser-delayed-startup-finished");
    const timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
    // Kept referenced until it fires, or it could be collected first.
    globalThis.onlybrowserosCleanupTimer = timer;
    timer.initWithCallback(() => {
      delete globalThis.onlybrowserosCleanupTimer;
      Cc["@mozilla.org/memory-reporter-manager;1"]
        .getService(Ci.nsIMemoryReporterManager)
        .minimizeMemoryUsage(() => {});
    }, 60000, Ci.nsITimer.TYPE_ONE_SHOT);
  };
  Services.obs.addObserver(onStartup, "browser-delayed-startup-finished");
} catch (e) {
  Cu.reportError("onlybrowseros.cfg: " + e);
}
