<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Downloads</title>
<style>
  /* Colours follow src/shared/theme.py. The lists are filled in by the
     OnlyBrowserOS extension (src/firefox/tablimit/files-page.js). */
  :root {
    --bg: #f3f7fd; --surface: #ffffff; --raised: #eef3fa; --border: #dbe3ef;
    --text: #0f1b3d; --muted: #56627a; --accent: #1f6fff; --bad: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 "Noto Sans", system-ui, sans-serif; padding: 0 16px; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 0 48px; }
  .back {
    display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none;
    font-weight: 600; padding: 6px 10px; margin-left: -10px; border-radius: 10px;
  }
  .back:hover, .back:focus-visible { background: var(--raised); color: var(--text); outline: none; }
  h1 { font-size: 32px; margin: 12px 0 4px; }
  h2 { font-size: 20px; margin: 32px 0 12px; }
  .lead { color: var(--muted); margin: 0 0 20px; }
  .files { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .file {
    display: flex; align-items: center; gap: 8px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 16px; padding: 6px 10px 6px 6px;
  }
  .file:hover { border-color: #b9cdf0; }
  .open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; color: inherit; text-decoration: none; padding: 4px; border-radius: 12px; }
  .open:focus-visible { outline: 3px solid rgba(31, 111, 255, .35); }
  .thumb { width: 56px; height: 56px; border-radius: 12px; background: var(--raised); display: grid; place-items: center; overflow: hidden; flex: none; color: var(--accent); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb svg { width: 28px; height: 28px; }
  .words { min-width: 0; }
  .words strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .words span { color: var(--muted); font-size: 13px; }
  .delete {
    height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
    font: inherit; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .delete:hover { color: var(--bad); border-color: #f5b5b5; }
  .delete.confirm { background: var(--bad); border-color: var(--bad); color: #fff; }
  .empty { background: var(--surface); border: 1px dashed var(--border); border-radius: 16px; padding: 24px; text-align: center; color: var(--muted); margin: 0; }
  .note { color: var(--bad); }
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">← Start page</a>
  <h1>Downloads</h1>
  <p class="lead">PDFs, pictures, videos, music and text you saved. Click one to open it.</p>
  <p class="empty" id="loading">Loading your files…</p>
  <ul class="files" id="downloads" aria-label="Downloads"></ul>
  <p class="empty" id="downloads-empty" hidden>Nothing here yet. When you download a PDF or a picture, it appears here.</p>
  <div id="usb"></div>
  <p class="note" id="note" role="alert"></p>
</main>
<script>
  // Opened without the OnlyBrowserOS extension, nothing fills the list.
  setTimeout(() => {
    if (!document.body.dataset.ready) {
      document.getElementById("loading").textContent =
        "Your downloads can only be shown on a computer running OnlyBrowserOS.";
    }
  }, 4000);
</script>
</body>
</html>
